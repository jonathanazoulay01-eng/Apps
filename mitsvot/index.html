<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mitsvot en jeu</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mitsvot">
<meta name="theme-color" content="#3446a8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800&family=Noto+Serif+Hebrew:wght@500;700&display=swap">
<style>
/* Layout: une colonne centrée façon "carnet de jeu", barre de score collante, onglets en pastilles */
:root{
  --bg:#eef1fa; --surface:#ffffff; --surface2:#e3e8f7; --fg:#1b2147; --muted:#5b6390;
  --wool:#3446a8; --wool-soft:#d9dffa; --flax:#5f8a2c; --flax-soft:#e1edd0; --gold:#e9a514; --gold-soft:#fcefc9;
  --bad:#c8373f; --bad-soft:#fbdfe0; --good:#2f8f4e; --good-soft:#d8f1e0; --line:#cdd4ee;
  --shadow:0 2px 0 #c3cbe8;
  --f-display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito", "Segoe UI", system-ui, sans-serif;
  --f-heb:"Noto Serif Hebrew", "David", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12152b; --surface:#1c2142; --surface2:#262c55; --fg:#eef0ff; --muted:#a7aed6;
  --wool:#8d9dff; --wool-soft:#2b3470; --flax:#a6d06a; --flax-soft:#2a3a1c; --gold:#f5c04a; --gold-soft:#4a3a12;
  --bad:#ff7b82; --bad-soft:#4a1d22; --good:#6fd893; --good-soft:#1b3d27; --line:#353c6e; --shadow:0 2px 0 #0b0d1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12152b; --surface:#1c2142; --surface2:#262c55; --fg:#eef0ff; --muted:#a7aed6;
  --wool:#8d9dff; --wool-soft:#2b3470; --flax:#a6d06a; --flax-soft:#2a3a1c; --gold:#f5c04a; --gold-soft:#4a3a12;
  --bad:#ff7b82; --bad-soft:#4a1d22; --good:#6fd893; --good-soft:#1b3d27; --line:#353c6e; --shadow:0 2px 0 #0b0d1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top, 0px);z-index:10;background:var(--bg)}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.opt:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.heb{font-family:var(--f-heb);direction:rtl;unicode-bidi:isolate}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--line)}
.brand{font-family:var(--f-display);font-weight:800;font-size:1.3rem;color:var(--wool);display:flex;align-items:center;gap:8px;margin-right:auto}
.spool{width:28px;height:28px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:800;font-variant-numeric:tabular-nums;font-size:.95rem}
.pill.xp{border-color:var(--gold);background:var(--gold-soft)}
.lvl{display:flex;flex-direction:column;gap:3px;min-width:140px}
.lvl small{font-weight:700;color:var(--muted);font-size:.78rem}
.bar{height:9px;border-radius:9px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .4s}

/* entête chapitre */
.chap{background:var(--wool);color:#fff;border-radius:22px;padding:20px 22px;display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.chap .eyebrow{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.78rem;opacity:.85}
.chap h1{font-size:clamp(1.7rem,5vw,2.3rem);color:#fff}
.chap .heb{font-size:1.35rem;color:#fff}
.chap select{font:inherit;font-weight:700;border-radius:12px;border:0;padding:6px 10px;background:#ffffff;color:#1b2147;max-width:100%}
.seal{width:84px;height:84px;border-radius:50%;background:#c8373f;color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;line-height:1;border:4px solid #f3d27a;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.seal small{display:block;font-size:.62rem;letter-spacing:.1em}
.seal b{font-size:1.6rem}
.mastery{grid-column:1/-1;display:flex;flex-direction:column;gap:5px}
.mastery .bar{background:rgba(255,255,255,.25);height:12px}
.mastery .bar>i{background:#f5c04a}
.mastery small{font-weight:700}

/* onglets */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:800;box-shadow:var(--shadow)}
.tab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* fiches */
.fiche{background:var(--surface);border-radius:20px;border:2px solid var(--line);overflow:hidden}
.fiche>header{padding:14px 20px;display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.fiche>header h2{font-size:1.45rem}
.fiche.s-mitsva>header{background:var(--wool-soft)}
.fiche.s-message>header{background:var(--gold-soft)}
.fiche.s-precisions>header{background:var(--flax-soft)}
.fiche .body{padding:6px 20px 20px;display:flex;flex-direction:column;gap:12px}
.fiche h3{font-size:1.15rem;margin-top:8px;color:var(--wool)}
.fiche p{margin:0;max-width:65ch}
.fiche ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.key{background:var(--gold-soft);padding:0 4px;border-radius:5px;font-weight:800}
.verse{border:2px dashed var(--line);border-radius:14px;padding:12px 16px;text-align:center;display:flex;flex-direction:column;gap:6px}
.verse .heb{font-size:1.35rem}
.icons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.icons div{background:var(--surface2);border-radius:14px;padding:10px 6px;text-align:center;font-weight:800;font-size:.85rem;line-height:1.2}
.icons svg{width:30px;height:30px;display:block;margin:0 auto 4px;color:var(--wool)}
.tip{background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:.95rem}
.tip b{color:var(--wool)}
.donebtn{align-self:flex-start;border:2px solid var(--flax);background:var(--flax-soft);color:var(--fg);border-radius:12px;padding:8px 14px;font-weight:800}
.donebtn[disabled]{opacity:.7;cursor:default}
.tag{font-size:.78rem;font-weight:800;border-radius:999px;padding:2px 10px;background:var(--surface);border:2px solid var(--line)}

/* cartes mémo */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{perspective:800px;height:170px;border:0;background:none;padding:0}
.card .in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.card.flip .in{transform:rotateY(180deg)}
.card .face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;text-align:center;border:2px solid var(--line);box-shadow:var(--shadow)}
.card .front{background:var(--surface);font-family:var(--f-display);font-weight:800;font-size:1.35rem;color:var(--wool)}
.card .front small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:700}
.card .back{background:var(--wool);color:#fff;transform:rotateY(180deg);font-weight:700;font-size:.98rem;line-height:1.35}

/* quiz */
.panel{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:14px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--wool);border-color:var(--wool);color:#fff}
.go{border:0;background:var(--gold);color:#1b2147;font-family:var(--f-display);font-weight:800;font-size:1.2rem;border-radius:14px;padding:10px 22px;box-shadow:0 3px 0 #b77f05;align-self:flex-start}
.go.alt{background:var(--surface2);color:var(--fg);box-shadow:var(--shadow)}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-weight:800;color:var(--muted);font-size:.9rem}
.qtype{background:var(--surface2);border-radius:999px;padding:2px 10px}
.qtext{font-size:1.25rem;font-weight:800;line-height:1.35}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:800;font-family:var(--f-display)}
.opt:hover:not([disabled]){border-color:var(--wool)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.ko{background:var(--bad-soft);border-color:var(--bad)}
.opt[disabled]{cursor:default}
.vf{grid-template-columns:1fr 1fr}
.vf .opt{justify-content:center;font-size:1.2rem;font-family:var(--f-display)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--wool);text-align:center;color:var(--wool)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .opt{padding:10px 12px;font-size:.95rem}
.match .opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.match .opt.done{opacity:.55}
.sortitem{font-family:var(--f-display);font-size:1.5rem;font-weight:800;text-align:center;background:var(--surface2);border-radius:16px;padding:14px}
.bins{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{border:3px dashed var(--line);border-radius:16px;padding:12px;min-height:120px;display:flex;flex-direction:column;gap:6px;background:var(--surface);text-align:left;min-width:0}
.bin>b{font-family:var(--f-display);font-size:1.1rem}
.bin:hover:not([disabled]){border-color:var(--wool)}
.bin span{font-size:.85rem;font-weight:700;background:var(--surface2);border-radius:8px;padding:2px 8px}
.bin span.ko{background:var(--bad-soft)}
.feedback{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.feedback.ok{background:var(--good-soft)}
.feedback.ko{background:var(--bad-soft)}
.feedback b{font-family:var(--f-display);font-size:1.2rem}
.progress{height:10px;border-radius:10px;background:var(--surface2);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--wool);transition:width .3s}
.combo{color:var(--gold);font-family:var(--f-display);font-weight:800}
.result{text-align:center;align-items:center}
.stars{font-size:2.6rem;letter-spacing:.1em;color:var(--gold)}
.stars .off{color:var(--line)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1;color:var(--wool)}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.4rem;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}

/* badges */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.badge{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px;align-items:center}
.badge .medal{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--muted)}
.badge.on .medal{background:var(--gold);color:#1b2147;box-shadow:0 3px 0 #b77f05}
.badge.on{border-color:var(--gold)}
.badge:not(.on){opacity:.6}
.badge b{font-family:var(--f-display)}
.badge small{color:var(--muted);font-weight:600;line-height:1.3}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:1.8rem;color:var(--wool);font-variant-numeric:tabular-nums}
.stat small{font-weight:700;color:var(--muted)}
.secrow{display:flex;flex-direction:column;gap:4px}
.secrow div{display:flex;justify-content:space-between;font-weight:700}
.note{color:var(--muted);font-size:.9rem}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:800;z-index:20;max-width:calc(100% - 32px);text-align:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;width:100%;height:100%}
.say{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-weight:800;font-size:.9rem;display:inline-flex;align-items:center;gap:6px;box-shadow:var(--shadow)}
.say.speaking{background:var(--gold);border-color:var(--gold);color:#1b2147}
button.pill[aria-pressed="true"]{background:var(--wool);border-color:var(--wool);color:#fff}
.danger{border:0;background:none;color:var(--muted);text-decoration:underline;font-weight:700;align-self:flex-start;padding:0}

[hidden]{display:none!important}
.kid{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.kid header{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kid header .av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.4rem;color:#fff;flex:none}
.kid header h3{font-size:1.3rem}
.kid header small{color:var(--muted);font-weight:700;display:block}
.kgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kgrid div{background:var(--surface2);border-radius:12px;padding:8px;text-align:center}
.kgrid b{display:block;font-family:var(--f-display);font-size:1.3rem;color:var(--wool);font-variant-numeric:tabular-nums}
.kgrid small{font-weight:700;color:var(--muted);font-size:.78rem}
.kch{display:flex;flex-direction:column;gap:6px;border-top:2px dashed var(--line);padding-top:10px}
.kch .t{display:flex;justify-content:space-between;font-weight:800;gap:8px}
.kbars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kbars small{font-weight:700;color:var(--muted);font-size:.78rem;display:block}
.kid details summary{cursor:pointer;font-weight:800;color:var(--wool)}
.kid details ul{margin:6px 0 0;padding-left:1.2em;font-size:.92rem}
.chcard.eval{border-color:var(--gold);background:var(--gold-soft)}
.chcard.eval.locked{border-style:dashed;background:var(--surface);box-shadow:none;opacity:.75}
.chcard.eval .score{font-family:var(--f-display);font-size:1.8rem;font-weight:800;color:var(--wool)}
.exam{display:flex;flex-direction:column;gap:12px}
.examhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 12px;border-left:6px solid var(--ex);padding-left:12px}
.examhead h2{font-size:1.45rem;color:var(--ex)}
.examhead span{font-weight:700;color:var(--muted)}
.examhead .cd{background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--fg);font-size:.88rem}
.theme{font-family:var(--f-display);font-weight:700;color:var(--muted);font-size:1.05rem;margin-top:2px}
.chcard.soon.named{justify-content:flex-start;align-items:flex-start;text-align:left;min-height:0;gap:4px}
.chcard.soon.named b{font-family:var(--f-display);color:var(--fg);font-size:1.1rem}
.sync{font-size:.8rem;font-weight:700;color:var(--muted)}
@media (max-width:520px){.kgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.kbars{grid-template-columns:1fr}}
/* écrans prénom + accueil */
.brand{cursor:pointer;border:0;background:none;padding:0}
.who{min-height:calc(100vh - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding-block:30px}
.who .logo{width:150px;height:150px;overflow:hidden;border-radius:28px;background:var(--surface);border:3px solid var(--gold);display:grid;place-items:center;box-shadow:0 4px 0 #b77f05;animation:bob 3s ease-in-out infinite}
.who .logo svg{width:70px;height:70px}
.who h1{font-size:clamp(2rem,7vw,2.8rem);color:var(--wool)}
.who p{margin:0;color:var(--muted);font-weight:700}
.profiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:620px}
.prof{border:3px solid var(--line);background:var(--surface);border-radius:20px;padding:14px 18px;min-width:150px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow)}
.prof:hover{border-color:var(--wool)}
.prof .av{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:#fff;margin-bottom:4px}
.prof b{font-family:var(--f-display);font-size:1.25rem}
.prof small{color:var(--muted);font-weight:700}
.newname{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%;max-width:420px}
.newname input{flex:1 1 200px;min-width:0;font:inherit;font-weight:700;font-size:1.1rem;padding:10px 14px;border-radius:14px;border:3px solid var(--line);background:var(--surface);color:var(--fg)}
.newname input:focus{outline:none;border-color:var(--wool)}
.hero{background:var(--wool);color:#fff;border-radius:26px;padding:26px 24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero h1{font-size:clamp(2rem,7vw,2.9rem);color:#fff}
.hero h1 .wave{display:inline-block;animation:wave 1.6s ease-in-out 2;transform-origin:70% 70%}
.hero p{margin:0;font-size:1.2rem;font-weight:700;max-width:34ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.hero .pill{background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.35);color:#fff}
.sectitle{font-family:var(--f-display);font-size:1.4rem;margin:0}
.chaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.chcard{border:3px solid var(--line);background:var(--surface);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);position:relative;min-width:0}
button.chcard:hover{border-color:var(--wool);transform:translateY(-2px)}
.chcard .eyebrow{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:.75rem;color:var(--muted)}
.chcard h3{font-size:1.35rem;color:var(--wool)}
.chcard .heb{font-size:1.05rem;color:var(--muted)}
.chcard .mini{position:absolute;right:14px;top:14px;width:50px;height:50px;border-radius:50%;background:#c8373f;color:#fff;display:grid;place-items:center;text-align:center;font-family:var(--f-display);font-weight:800;line-height:1;border:3px solid #f3d27a;font-size:1rem}
.chcard .mini small{display:block;font-size:.45rem;letter-spacing:.08em}
.chcard .stars3{color:var(--gold);font-size:1.2rem;letter-spacing:.08em}
.chcard .stars3 .off{color:var(--line)}
.chcard.soon{border-style:dashed;box-shadow:none;opacity:.7;justify-content:center;align-items:center;text-align:center;min-height:170px;color:var(--muted);font-weight:800}
.back{border:0;background:none;color:var(--wool);font-weight:800;padding:0;align-self:flex-start}
@keyframes wave{0%,100%{transform:rotate(0)}20%{transform:rotate(16deg)}40%{transform:rotate(-8deg)}60%{transform:rotate(14deg)}80%{transform:rotate(-4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes pop{from{transform:scale(.92);opacity:.4}to{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}

@media (max-width:520px){
  body{font-size:16px}
  .chap{grid-template-columns:1fr}

      <p>Ce chapitre comporte <span class="key">deux Mitsvot</span> :</p>
      <ul>
        <li><b>Donner</b> aux gens pauvres ce dont ils ont besoin.</li>
        <li><b>Ne pas ignorer</b> les besoins des gens pauvres.</li>
      </ul>
      <div class="verse">
        <div class="heb">מִצְוַת צְדָקָה</div>
        <div><b>La mitsva de donner la tsedaka</b> · Mitsva n° 249</div>
        <div class="note">(Devarim 15, 11)</div>
        <div>« Le pauvre ne cessera jamais dans la terre ; c’est pourquoi Je t’ordonne : <b>ouvre ta main généreusement</b> à ton frère pauvre et nécessiteux dans ton pays. »</div>
      </div>
      <div class="verse">
        <div class="heb">שֶׁלֹּא לִמְנוֹעַ מִלְּהַחֲיוֹת הֶעָנִי וּמִלִּיתֵּן לוֹ מַה שֶּׁהוּא צָרִיךְ</div>
        <div><b>Ne pas s’empêcher de donner au pauvre ce dont il a besoin</b> · Mitsva n° 250</div>
        <div class="note">(Devarim 15, 7)</div>
        <div>« <b>N’endurcis pas ton cœur et ne ferme pas ta main</b> contre ton frère nécessiteux. »</div>
      </div>
      <h3>Qui ? Où ? Quand ?</h3>
      <ul>
        <li>Les deux Mitsvot : <b>toute personne</b>, <b>à tout endroit</b>, <b>à toute époque</b>.</li>
        <li>Mitsva n° 250 : <span class="key">pas de punition</span>.</li>
      </ul>`,
    precisions:`
      <h3>💰 Donner la Tsedaka</h3>
      <ul>
        <li>Si quelqu’un te demande de l’aide (argent, nourriture…), tu n’as <b>pas le droit de l’ignorer</b> ni de le renvoyer sans rien.</li>
        <li><b>Mitsva positive</b> : donner autant qu’on peut (nourriture, habits, abri, argent…). <b>Mitsva négative</b> : ne pas s’empêcher de donner si on peut aider.</li>
        <li>En <span class="key">une seule action</span>, on accomplit les deux Mitsvot.</li>
        <li><b>Chaque Juif</b> doit donner la tsedaka, <b>même le pauvre</b> qui en reçoit !</li>
      </ul>
      <h3>⚖️ Combien donner ?</h3>
      <ul>
        <li>Le <b>ma’assère ksafim</b> = donner <span class="key">un dixième</span> de ses revenus. La tsedaka, elle, n’a <b>pas de mesure fixe</b> : autant que tu peux. Plus on est riche, plus on donne.</li>
        <li>Si tu ne peux pas donner beaucoup, n’ignore pas le pauvre : <b>même une toute petite somme</b>, c’est la mitsva. Ne t’énerve pas : parle-lui <b>calmement et gentiment</b>.</li>
        <li>À chaque pauvre, on donne <b>ce dont il a besoin</b> : à manger s’il a faim, des vêtements s’il doit s’habiller. Un pauvre qui était très riche avant : on remplace ce à quoi il était habitué.</li>
        <li>On n’est pas obligé de tout faire seul : on donne ce qu’on peut et on prévient les <b>organisations charitables</b>.</li>
      </ul>
      <h3>😊 Comment donner ?</h3>
      <ul>
        <li>Avec <b>gentillesse</b>, des mots de réconfort, en ressentant sa peine, <b>heureux et de bon cœur</b>.</li>
        <li>Donner avec un <span class="key">visage renfrogné</span> fait perdre le mérite de la mitsva, même pour une très grosse somme.</li>
      </ul>
      <h3>🎁 Différentes sortes de Tsedaka</h3>
      <ul>
        <li>Aider au <b>mariage d’une jeune fille pauvre</b> (surtout orpheline) : une des plus grandes formes de tsedaka.</li>
        <li>Même un <b>riche</b> peut avoir besoin d’aide (s’il tombe malade, s’il cherche un objet que toi tu as).</li>
        <li>La tsedaka, ce peut être aussi des <b>mots gentils</b> ou juste <b>un sourire</b>.</li>
      </ul>
      <h3>👨‍👩‍👧 Les priorités (dans l’ordre)</h3>
      <ul>
        <li>1. Tes parents · 2. Tes enfants · 3. Tes frères et sœurs · 4. Ta famille (même de lointains cousins) · 5. Un voisin · 6. Les pauvres de ta ville · 7. Les pauvres d’Eretz Israël · 8. Les pauvres d’une autre ville.</li>
      </ul>
      <h3>🪜 Les huit niveaux (du plus haut au plus bas)</h3>
      <ul>
        <li><b>1.</b> Aider l’autre à <span class="key">gagner sa vie</span> : prêt, partenariat, travail, formation.</li>
        <li><b>2.</b> Ni le donneur ni le pauvre ne savent qui est l’autre (ex. : <b>boîte de tsedaka</b>, si celui qui distribue est digne de confiance).</li>
        <li><b>3.</b> Le donneur sait qui reçoit, le pauvre ne sait pas qui a donné (des Sages déposaient l’argent devant la porte).</li>
        <li><b>4.</b> Le pauvre sait qui a donné, le donneur ne sait pas qui a reçu (des Sages laissaient tomber des bourses derrière eux).</li>
        <li><b>5.</b> Donner <b>avant</b> que le pauvre demande.</li>
        <li><b>6.</b> Donner <b>après</b> qu’il a demandé.</li>
        <li><b>7.</b> Donner moins qu’on devrait, mais <b>gentiment</b>.</li>
        <li><b>8.</b> Donner <b>le cœur lourd et avec regret</b> : le niveau le plus bas.</li>
      </ul>
      <div class="tip"><b>Fais le point :</b> comment doit-on donner la tsedaka ?</div>`
  },

      <p>Ce chapitre comporte <span class="key">trois Mitsvot</span> :</p>

const KEY="mitsvot-jeu-v2", OLDKEY="mitsvot-jeu-v1";

let DB=loadDB(), S=fresh();
function loadDB(){
  let db={current:null,profiles:{},legacy:null};
  try{const r=JSON.parse(localStorage.getItem(KEY)||"null"); if(r) db=Object.assign(db,r);}catch(e){}
  if(!Object.keys(db.profiles).length&&!db.legacy){ try{db.legacy=JSON.parse(localStorage.getItem(OLDKEY)||"null");}catch(e){} }
  return db;
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function save(){ if(DB.current){DB.profiles[DB.current]=Object.assign(S,{seen:Date.now()});} persist(); schedulePush(); }
/* ---------- Sauvegarde en ligne (Supabase) ---------- */
const SB={url:"https://qddkzkqhzbbwrfledovv.supabase.co",key:"sb_publishable_nPMIwWtnns93yIvKOQpkUg_6NZsyNCJ"};
async function rpc(fn,args,opt={}){
  const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(),opt.timeout||8000);
  try{
    const r=await fetch(SB.url+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB.key,"Content-Type":"application/json"},body:JSON.stringify(args),keepalive:!!opt.keepalive,signal:ctl.signal});
    const t=await r.text(); let j=null; try{j=t?JSON.parse(t):null;}catch(e){}
    if(!r.ok) throw new Error((j&&j.message)||("Erreur "+r.status));
    return j;
  } finally{clearTimeout(to);}
}
let pushT=null, dirty=false;
function schedulePush(){ if(!DB.current) return; dirty=true; clearTimeout(pushT); pushT=setTimeout(()=>pushNow(false),2500); }
function pushNow(keep){
  if(!dirty||!DB.current) return; dirty=false;
  rpc("mitsvot_save",{p_name:DB.current,p_data:S},{keepalive:keep}).catch(()=>{dirty=true;});
}
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") pushNow(true); });
async function pullProfile(name){
  try{
    const r=await rpc("mitsvot_load",{p_name:name},{timeout:4000});
    if(!r||!r.data) return false;
    const local=DB.profiles[name];
    if(!local||(r.data.seen||0)>(local.seen||0)){ DB.profiles[name]=r.data; persist(); return true; }
  }catch(e){}
  return false;
}

function useProfile(name){
  if(!DB.profiles[name]){ DB.profiles[name]=Object.assign(fresh(),DB.legacy||{},{created:Date.now()}); DB.legacy=null; }
  DB.current=name; S=Object.assign(fresh(),DB.profiles[name]); save();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isHeb=s=>/[֐-׿]/.test(s);
const txt=s=>isHeb(s)&&!/[a-zA-Z]/.test(s)?`<span class="heb">${esc(s)}</span>`:esc(s);

/* ---------- progression ---------- */
function mastered(q){const r=S.qs[q.id];return r&&r.last;}
function secMastery(ch,sec){const qs=ch.questions.filter(q=>!sec||q.s===sec);return qs.length?qs.filter(mastered).length/qs.length:0;}
function level(){const n=Math.floor(S.xp/150);return {n:n+1,name:LEVELS[Math.min(n,LEVELS.length-1)],pct:(S.xp%150)/150*100};}
function addXP(n){S.xp+=n;save();renderTop();}
function renderTop(){
  const l=level();
  $("#xp").textContent=S.xp; $("#best").textContent=S.best;
  $("#lvlName").textContent=`Niveau ${l.n} · ${l.name}`; $("#lvlBar").style.width=l.pct+"%";
}
function renderChapHead(){
  const ch=chap(), m=Math.round(secMastery(ch)*100);

    <div class="mastery"><small>Chapitre maîtrisé à ${m} %</small><div class="bar"><i style="width:${m}%"></i></div></div>`;

/* ---------- lecture à voix haute ---------- */
const TTS={ok:"speechSynthesis" in window, fr:null, he:null, btn:null, run:0};
const GOODVOICE=/premium|enhanced|améliorée|amelioree|natural|neural|online|siri/i;
function bestVoice(list,names){
  return list.find(x=>GOODVOICE.test(x.name)&&names.test(x.name))||list.find(x=>GOODVOICE.test(x.name))||list.find(x=>names.test(x.name))||list[0]||null;
}
function pickVoice(){
  if(!TTS.ok) return;
  const all=speechSynthesis.getVoices();
  const fr=all.filter(x=>/^fr[-_]FR/i.test(x.lang)); const fr2=fr.length?fr:all.filter(x=>/^fr/i.test(x.lang));
  TTS.fr=bestVoice(fr2,/Amélie|Amelie|Audrey|Marie|Thomas|Denise|Henri|Google/i);
  TTS.he=bestVoice(all.filter(x=>/^(he|iw)/i.test(x.lang)),/Carmit|Hila|Avri|Google/i);
}
if(TTS.ok){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
/* prononciation à la française des mots hébreux écrits en lettres latines */
const PRON=[
  [/Cha['’]atnez/gi,"Chaatnèze"],[/['’]Hok\b/g,"Rhok"],[/\bHok\b/g,"Rhok"],[/Malkout/gi,"Malkoute"],
  [/Miderabbanane/gi,"Midérabanane"],[/Mitsvot\b/g,"Mitsvote"],[/Hachem/g,"Hachème"],[/Devarim/g,"Dévarim"],
  [/Béréchit/g,"Béréchite"],[/Chemot/g,"Chémote"],[/Vayikra/g,"Vaïkra"],[/Chabbat/g,"Chabbate"],[/Tsitsit/g,"Tsitsite"],
  [/Tefilin/g,"Téfiline"],[/Cohanim/g,"Coanime"],[/Hala['’]hot/g,"Halarote"],[/Harambam/gi,"Harambame"],[/Torah/g,"Tora"],
  [/[Tt]sedaka/g,"tsédaka"],[/[Bb]ikourim/g,"bikourime"],[/[Cc]hiv['’]?at haminim/g,"chivat haminime"],[/Beth Hamikdach/g,"Bèt Hamikdache"],
  [/Cohanim/g,"Coanime"],[/Cohen/g,"Coène"],[/[Mm]a['’]ass[èe]re ksafim/g,"maassère ksafime"],[/Eretz/g,"Érets"],[/Yarden/g,"Yardène"],
  [/Si['’]hon/g,"Sirone"],[/Chavou['’]ot/g,"Chavouote"],[/['’]Hanoucca/g,"Ranouka"],[/Souccot/g,"Soukote"],[/Lachone Hakodech/g,"Lachone Hakodèche"],
  [/['’]Azara/g,"Azara"],[/Mizbéa['’]h/g,"Mizbéar"],[/['’]Ha['’]hamim/g,"Rarhamime"],[/Chelamim/gi,"Chélamime"],[/Mikra/g,"Mikra"],[/Sefer/g,"Séfère"],
  [/Pessa['’]h/g,"Pessar"],[/Yaacov/g,"Yaakov"]
];
function frClean(t){
  t=String(t);
  PRON.forEach(([r,v])=>t=t.replace(r,v));
  return t.replace(/\p{Extended_Pictographic}|️/gu," ")
    .replace(/[’‘]/g,"'").replace(/\s*\+\s*/g," et ").replace(/\s*=\s*/g," : ").replace(/\s*[()·]\s*/g,", ").replace(/n°\s*/g,"numéro ").replace(/_{2,}/g,"…")
    .replace(/[«»\[\]•✔✘✓✗]/g," ").replace(/\s*\/\s*/g,", ")
    .replace(/\s+([.,!?;:])/g,"$1").replace(/,+([.,!?;:])/g,"$1").replace(/([.!?;:])[.\s]*\./g,"$1").replace(/([:;!?,])(?=[^\s\d…])/g,"$1 ")
    .replace(/\s+/g," ").replace(/^[\s.,;:!?]+/,"").trim();
}
/* découpe en morceaux : texte français par blocs de phrases, mots hébreux à part (voix hébraïque) */
function segments(text){
  const out=[]; const re=/([֐-׿יִ-ﭏ][֐-׿יִ-ﭏ\s׳״'"־,]*)/g;
  String(text).split(re).forEach((part,i)=>{
    if(!part||!part.trim()) return;
    if(i%2){ if(TTS.he) out.push({he:true,t:part.replace(/[,\s]+$/,"")}); return; }
    const t=frClean(part); if(!t.replace(/[^\p{L}\p{N}]/gu,"").length) return;
    // regroupe les phrases en morceaux d’environ 220 caractères pour une lecture fluide
    let cur="";
    t.split(/(?<=[.!?])\s+/).forEach(s=>{ if((cur+" "+s).length>220&&cur){out.push({t:cur});cur=s;} else cur=cur?cur+" "+s:s; });
    if(cur) out.push({t:cur});
  });
  return out;
}
function stopSpeech(){ TTS.run++; if(TTS.ok) speechSynthesis.cancel(); if(TTS.btn){TTS.btn.classList.remove("speaking");TTS.btn=null;} }
function speak(text,btn){
  if(!TTS.ok){toast("La lecture à voix haute n’est pas disponible sur cet appareil");return;}
  const same=btn&&TTS.btn===btn; stopSpeech(); if(same) return;
  const segs=segments(text); if(!segs.length) return;
  if(btn){TTS.btn=btn;btn.classList.add("speaking");}
  const run=TTS.run;
  segs.forEach((s,i)=>{
    const u=new SpeechSynthesisUtterance(s.t);
    if(s.he){u.lang="he-IL";u.voice=TTS.he;u.rate=.9;}
    else{u.lang="fr-FR";if(TTS.fr)u.voice=TTS.fr;u.rate=1;}
    if(i===segs.length-1) u.onend=u.onerror=()=>{if(run===TTS.run&&TTS.btn===btn&&btn){btn.classList.remove("speaking");TTS.btn=null;}};
    speechSynthesis.speak(u);
  });
}
function nodeSpeech(el){
  const c=el.cloneNode(true);
  c.querySelectorAll("button,small,svg,script,style").forEach(n=>n.remove());
  c.querySelectorAll(".blank").forEach(n=>n.textContent=" … ");
  c.querySelectorAll("li,p,h2,h3,.verse>div,.icons>div,.tip").forEach(n=>n.append("\u2029"));
  return c.textContent.replace(/\s*\u2029[\s\u2029]*/g,"\u2029")
    .replace(/([.!?:;…])?\s*\u2029/g,(m,p)=>p?p+" ":". ").trim();
}
function questionSpeech(){
  const qt=$("#qt"); if(!qt) return "";
  let t=nodeSpeech(qt); if(!/[.!?…]$/.test(t)) t+=".";
  if(document.querySelector("#qa .vf")) return t+" Vrai, ou faux ?";
  const opts=[...document.querySelectorAll("#qa .opts .opt, #qa .choices .opt")];
  if(opts.length) t+=" "+opts.map(o=>{const l=o.querySelector(".l");return (l?l.textContent+", ":"")+nodeSpeech(o.querySelector("span:last-child")||o).replace(/[.\s]+$/,"");}).join(". ")+".";
  const L=[...document.querySelectorAll("#qa [data-l]")], R=[...document.querySelectorAll("#qa [data-r]")];
  if(L.length) t+=" À gauche : "+L.map(nodeSpeech).join(", ")+". À droite : "+R.map(nodeSpeech).join(", ")+".";
  const si=$("#si"); if(si) t+=" À classer : "+si.textContent+".";
  return t;
}

  if(!Q) return show("quiz");
  const done=Q.i+(view.querySelector("#next")?1:0), n=Math.max(done,1), pct=Q.ok/n;
  const stars=pct>=.9?3:pct>=.7?2:pct>=.4?1:0;
  if(done>=10&&Q.ok===done) award("parfait");
  if(stars===3) confetti();
  const msg=stars===3?"Extraordinaire, tu es un vrai expert !":stars===2?"Très bien ! Encore un petit effort.":stars===1?"C’est un bon début, relis la fiche et réessaie.":"Relis la fiche tranquillement, puis retente ta chance !";
  view.innerHTML=`<div class="panel result">
    <h2>Résultat</h2>
    <div class="stars">${[0,1,2].map(i=>`<span class="${i<stars?"":"off"}">★</span>`).join("")}</div>
    <div class="big">${Q.ok} / ${done}</div>
    <p style="margin:0;font-weight:700">${msg}</p>
    <span class="pill xp">+${Q.gained} ⭐ gagnées</span>
    ${Q.wrong.length?`<div style="text-align:left;width:100%"><b>À revoir :</b><ul>${Q.wrong.map(q=>`<li>${txt(q.q)}<br><small class="note">${txt(q.e)}</small></li>`).join("")}</ul></div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="go" id="again">Rejouer</button>
      ${Q.wrong.length?`<button class="go alt" id="redo">🔁 Refaire mes erreurs</button>`:""}
      <button class="go alt" id="menu">Menu des quiz</button>
    </div></div>`;
  const sec=Q.sec, wrong=Q.wrong.slice(); Q=null;
  renderChapHead();
  $("#again").onclick=()=>startQuiz(sec==="errors"?"all":sec,quizLen);
  $("#menu").onclick=()=>show("quiz");
  const r=$("#redo"); if(r) r.onclick=()=>{Q={list:shuffle(wrong),i:0,ok:0,combo:0,wrong:[],sec:"errors",gained:0};renderQ();};
}

/* ---------- DÉFI ÉCLAIR ---------- */
let D=null, timerId=null;
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function viewDefiMenu(){
  const ch=chap(), best=S.defiBest[ch.id]||0;
  view.innerHTML=`<div class="panel result">
    <h2>⚡ Défi éclair</h2>
    <p style="margin:0;max-width:46ch">Tu as <b>60 secondes</b> pour répondre à un maximum de questions (vrai ou faux, QCM, textes à trous). Chaque bonne réponse : +5 ⭐. Une erreur fait perdre 3 secondes !</p>
    <div class="stats" style="width:100%;max-width:360px;grid-template-columns:1fr 1fr">
      <div class="stat"><b>${best}</b><small>Mon record</small></div>
      <div class="stat"><b>12</b><small>Pour le trophée</small></div>
    </div>
    <button class="go" id="goD" style="align-self:center">Lancer le chrono</button></div>`;
  $("#goD").onclick=startDefi;
}
function startDefi(){
  const ch=chap();
  D={pool:shuffle(ch.questions.filter(q=>["qcm","vf","trou"].includes(q.t))),k:0,ok:0,time:60};
  renderDefi();
  timerId=setInterval(()=>{D.time--;const t=$("#tm");if(t){t.textContent=D.time+" s";t.classList.toggle("low",D.time<=10);}if(D.time<=0)endDefi();},1000);
}
function renderDefi(){
  if(D.k>=D.pool.length){D.pool=shuffle(D.pool);D.k=0;}
  const q=D.pool[D.k];
  view.innerHTML=`<div class="panel"><div class="qhead"><span class="timer ${D.time<=10?"low":""}" id="tm">${D.time} s</span><span class="pill xp">✓ ${D.ok}</span></div>
    <div class="qtext" id="qt"></div><div id="qa"></div></div>`;
  RENDER[q.t](q,$("#qt"),$("#qa"),ok=>{
    if(ok){D.ok++;S.xp+=5;}else{D.time=Math.max(0,D.time-3);}
    const r=S.qs[q.id]||{ok:0,ko:0}; ok?r.ok++:r.ko++; r.last=ok; S.qs[q.id]=r; save(); renderTop();
    setTimeout(()=>{if(!timerId)return; if(D.time<=0)return endDefi(); D.k++; renderDefi();},ok?450:1100);
  });
}
function endDefi(){
  stopTimer(); const ch=chap();
  const rec=D.ok>(S.defiBest[ch.id]||0); if(rec)S.defiBest[ch.id]=D.ok; save();
  if(D.ok>=12) award("eclair"); checkBadges();
  if(rec&&D.ok>0) confetti();
  view.innerHTML=`<div class="panel result"><h2>Temps écoulé !</h2><div class="big">${D.ok}</div>
    <p style="margin:0;font-weight:700">${rec&&D.ok>0?"🎉 Nouveau record !":"bonnes réponses"}</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="go" id="re">Rejouer</button><button class="go alt" id="bk">Retour</button></div></div>`;
  $("#re").onclick=startDefi; $("#bk").onclick=()=>show("defi");
  renderChapHead();
}

    </div>

    $("#rz").innerHTML=`<div class="feedback ko"><b>Tout effacer ?</b><span>Les étoiles, trophées et réponses de ${esc(DB.current)} seront supprimés. Les autres prénoms ne changent pas.</span>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="go" id="yes" style="background:var(--bad);color:#fff;box-shadow:none">Oui, tout effacer</button><button class="go alt" id="no">Annuler</button></div></div>`;
    $("#yes").onclick=()=>{S=Object.assign(fresh(),{autoRead:S.autoRead,chap:S.chap});save();renderTop();renderChapHead();show("trophees");toast("Progression remise à zéro");};
    $("#no").onclick=()=>show("trophees");
  };
}

/* ---------- effets ---------- */
let toastT;
function toast(m){
  let t=$(".toast"); if(!t){t=document.createElement("div");t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400);
}
function confetti(){
  if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c=$("#confetti"), x=c.getContext("2d"); c.hidden=false;
  c.width=innerWidth; c.height=innerHeight;
  const cols=["#3446a8","#e9a514","#5f8a2c","#c8373f","#8d9dff"];
  const P=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6,s:4+Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  let f=0;(function tick(){
    x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(++f<150) requestAnimationFrame(tick); else {x.clearRect(0,0,c.width,c.height);c.hidden=true;}
  })();
}

function screen(id){
  stopTimer(); stopSpeech();
  ["scrWho","scrHome","scrChap","scrParent"].forEach(x=>$("#"+x).hidden=x!==id);
  $("#topbar").hidden=id==="scrWho"||id==="scrParent";
  window.scrollTo({top:0});
}
function chapPct(ch){return Math.round(secMastery(ch)*100);}
function profStats(p){
  const n=Math.floor((p.xp||0)/150);
  return `Niveau ${n+1} · ⭐ ${p.xp||0}`;
}
function showWho(){
  const names=Object.keys(DB.profiles).sort((a,b)=>(DB.profiles[b].seen||0)-(DB.profiles[a].seen||0));
  $("#scrWho").innerHTML=`
    <div class="logo"><img src="${LOGO}" alt="Hidone 613" style="width:100%;height:100%;object-fit:contain;border-radius:24px"></div>
    <h1>Qui étudie aujourd’hui ?</h1>
    ${names.length?`<p>Touche ton prénom pour reprendre là où tu t’étais arrêté.</p>
    <div class="profiles">${names.map(n=>`<button class="prof" data-n="${esc(n)}"><span class="av" style="background:${avColor(n)}">${esc([...n][0].toUpperCase())}</span><b>${esc(n)}</b><small>${profStats(DB.profiles[n])}</small></button>`).join("")}</div>
    <p style="margin-top:6px">Ou commence avec un autre prénom :</p>`:`<p>Écris ton prénom pour commencer.</p>`}
    ${legacyInfo()}
    <form class="newname" id="newForm">
      <input id="newName" maxlength="20" autocomplete="off" placeholder="Ton prénom" aria-label="Ton prénom">
      <button class="go" type="submit">C’est parti !</button>
    </form>
    <button class="back" id="parentBtn" style="align-self:center;margin-top:10px">👨‍👩‍👧 Espace parent</button>`;
  screen("scrWho");
  $("#scrWho").querySelectorAll(".prof").forEach(b=>b.onclick=()=>login(b.dataset.n));
  $("#parentBtn").onclick=()=>showParent();
  $("#newForm").onsubmit=e=>{
    e.preventDefault();
    let n=$("#newName").value.trim().replace(/\s+/g," ");
    if(!n){toast("Écris ton prénom 🙂");$("#newName").focus();return;}
    n=n.charAt(0).toUpperCase()+n.slice(1);
    login(n);
  };
}
function legacyInfo(){
  const L=DB.legacy; if(!L||!(L.xp||Object.keys(L.qs||{}).length)) return "";
  const n=Object.keys(L.qs||{}).length;
  return `<div class="feedback ok" style="max-width:440px;text-align:left"><b>🎒 Ta progression est bien gardée !</b>
    <span>On a retrouvé ⭐ ${L.xp||0} étoiles, ${n} questions déjà vues et ${Object.keys(L.badges||{}).length} trophées. Écris ton prénom ci-dessous : tout sera rattaché à ce prénom.</span></div>`;
}
async function login(name){
  document.querySelectorAll("#scrWho button").forEach(b=>b.disabled=true);
  const wasNew=!DB.profiles[name];
  const fromCloud=await pullProfile(name);
  const hadLegacy=!DB.profiles[name]&&DB.legacy;
  useProfile(name);
  if(fromCloud&&wasNew) setTimeout(()=>toast(`☁️ Progression de ${name} retrouvée !`),400);
  if(hadLegacy) setTimeout(()=>toast(`🎒 Ta progression est maintenant rattachée à ${name} !`),400);
  $("#whoName").textContent=name;
  $("#autoRead").setAttribute("aria-pressed",!!S.autoRead);
  renderTop(); showHome(true);
}
function showHome(greet){
  const name=DB.current, last=CHAPITRES.find(c=>c.id===S.chap)||CHAPITRES[0];
  const totalQ=CHAPITRES.reduce((a,c)=>a+c.questions.length,0);
  const doneQ=CHAPITRES.reduce((a,c)=>a+c.questions.filter(mastered).length,0);
  const trophies=Object.keys(S.badges).length;
  const started=Object.keys(S.qs).length>0;
  $("#scrHome").innerHTML=`
    <div class="hero ${greet?"pop":""}">
      <h1>Bonjour ${esc(name)} ! <span class="wave">👋</span></h1>
      <p>Prêt à étudier et relever les défis&nbsp;?</p>
      <div class="row">
        <span class="pill">⭐ ${S.xp} étoiles</span>
        <span class="pill">🏆 ${trophies} trophée${trophies>1?"s":""}</span>
        <span class="pill">✅ ${doneQ} / ${totalQ} questions réussies</span>
      </div>
      ${(()=>{const nx=nextExam();return nx?`<div class="row"><span class="pill">📅 ${nx.titre} ${countdown(nx)} · ${frDate(nx.date)}</span></div>`:"";})()}
      <div class="row"><button class="go" id="contBtn">${started?`Continuer : ${esc(last.titre)} →`:"Oui, je commence ! →"}</button></div>
    </div>
    <h2 class="sectitle">Mon programme · ’Hidone HaRambam 5787</h2>
    ${homeGrid()}`;
  screen("scrHome");
  $("#contBtn").onclick=()=>openChap(last.id);
  $("#scrHome").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>openChap(b.dataset.c));
  $("#scrHome").querySelectorAll("[data-eval]").forEach(b=>b.onclick=()=>openEval(b.dataset.eval));
  if(greet){ confetti(); speak(`Bonjour ${name} ! Prêt à étudier et relever les défis ?`); }
}
function chapCard(c){
  const p=chapPct(c),st=p>=100?3:p>=60?2:p>=25?1:0;
  return `<button class="chcard" data-c="${c.id}">
    <span class="mini" style="${String(c.mitsva).length>3?"width:64px;height:64px;font-size:"+(String(c.mitsva).length>7?".58rem":".72rem"):""}"><span><small>${String(c.mitsva).length>3?"MITSVOT":"MITSVA"}</small>${c.mitsva}</span></span>
    <span class="eyebrow">Chapitre ${c.numero}</span>
    <h3 style="padding-right:70px">${esc(c.titre)}</h3>
    <span class="heb">${c.hebreu}</span>
    <span class="stars3">${[0,1,2].map(i=>`<span class="${i<st?"":"off"}">★</span>`).join("")}</span>
    <span class="secrow" style="width:100%"><span style="display:flex;justify-content:space-between;font-weight:700"><span>Maîtrisé</span><span>${p} %</span></span><span class="progress"><i style="width:${p}%"></i></span></span>
  </button>`;
}

const examNums=ex=>ex.final?PROGRAMME.filter(e=>!e.final).flatMap(e=>e.groupes.flatMap(g=>g.chapitres.map(c=>c[0]))):ex.groupes.flatMap(g=>g.chapitres.map(c=>c[0]));
const chapByNum=n=>CHAPITRES.find(c=>c.numero===n);
const examChapters=ex=>examNums(ex).map(chapByNum).filter(Boolean);
const examById=id=>PROGRAMME.find(e=>e.id===id);
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function frDate(iso){const [y,m,d]=iso.split("-").map(Number);return `${d} ${MOIS[m-1]} ${y}`;}
function daysTo(iso){const t=new Date(iso+"T09:00:00"), n=new Date();return Math.ceil((t-n)/86400000);}
function countdown(ex){const d=daysTo(ex.date);return d>1?`dans ${d} jours`:d===1?"demain":d===0?"aujourd’hui":"passé";}
function mention(n){return n>=18?"Excellent":n>=16?"Très bien":n>=13?"Bien":n>=10?"Assez bien":"À retravailler";}
function evalCard(ex){
  const chs=examChapters(ex), total=examNums(ex).length, r=(S.evals||{})[ex.id];
  if(!chs.length) return `<div class="chcard eval locked"><span class="eyebrow">Évaluation · ${ex.titre}</span><h3>🔒 ${ex.final?"Tous les chapitres":"Bientôt"}</h3><span class="note">Elle s’ouvre dès que le premier chapitre de cet examen est disponible.</span></div>`;
  return `<button class="chcard eval" data-eval="${ex.id}">
    <span class="eyebrow">Évaluation · ${ex.titre}</span>
    <h3>🎓 ${ex.final?"Révision de toute l’année":"Entraînement à l’examen"}</h3>
    ${r?`<span class="score">${r.best} / 20</span><span style="font-weight:800">${mention(r.best)} · meilleure note</span>`:`<span style="font-weight:700">${ex.size} questions notées sur 20.</span>`}
    <span class="note">${chs.length===total?`Porte sur les ${total} chapitres.`:`Porte pour l’instant sur ${chs.length} chapitre${chs.length>1?"s":""} sur ${total} : elle s’enrichira à chaque nouveau chapitre.`}</span>
  </button>`;
}
function soonCard(n,t){return `<div class="chcard soon named"><span class="eyebrow">Chapitre ${n}</span><b>${esc(t)}</b><span>🔒 bientôt disponible</span></div>`;}
function homeGrid(){
  return PROGRAMME.map(ex=>`<section class="exam" style="--ex:${ex.color}">
    <div class="examhead"><h2>${ex.titre}</h2><span>${frDate(ex.date)} · ${ex.heb}</span><span class="cd">📅 ${countdown(ex)}</span></div>
    ${ex.final?`<p class="note" style="margin:0">Sur tous les chapitres de l’année.</p>`:""}
    ${ex.groupes.map(g=>`${g.theme?`<div class="theme">${g.themeHeb?`<span class="heb">${g.themeHeb}</span> · `:""}${g.theme}</div>`:""}
      <div class="chaps">${g.chapitres.map(([n,t])=>{const c=chapByNum(n);return c?chapCard(c):soonCard(n,t);}).join("")}</div>`).join("")}
    <div class="chaps">${evalCard(ex)}</div>
  </section>`).join("");
}
function nextExam(){return PROGRAMME.find(e=>daysTo(e.date)>=0);}
function openEval(id){
  const ex=examById(id), chs=examChapters(ex); if(!chs.length) return;
  const size=ex.size, per=Math.floor(size/chs.length); let list=[];
  chs.forEach((c,i)=>{ const n=Math.max(1,per+(i<size-per*chs.length?1:0)); list=list.concat(shuffle(c.questions).slice(0,n)); });
  list=shuffle(list).slice(0,size);
  S.chap=chs[0].id;
  screen("scrChap"); $("#tabs").hidden=true; $("#backHome").textContent="← Quitter l’évaluation";
  $("#chapHead").innerHTML=`<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><span class="eyebrow">Évaluation · ${ex.titre} · ${frDate(ex.date)}</span><h1>${ex.final?"Toute l’année":"Entraînement à l’examen"}</h1><div>${chs.map(c=>`Ch. ${c.numero} ${esc(c.titre)}`).join(" · ")}</div></div><div class="seal"><div><small>NOTE</small><b>/20</b></div></div>`;
  Q={list,i:0,ok:0,combo:0,wrong:[],sec:"eval",gained:0,eval:id};
  renderQ();
}
function endEval(){
  const id=Q.eval, ex=examById(id), total=Q.list.length, done=Q.i+(view.querySelector("#next")?1:0);
  const note=Math.round(Q.ok/total*20), complete=done>=total;
  S.evals=S.evals||{};
  if(complete){ const prev=S.evals[id]; S.evals[id]={best:Math.max(note,prev?prev.best:0),last:note,date:Date.now(),tries:(prev?prev.tries:0)+1}; save(); }
  if(complete&&note>=16){ award("eval-"+id,"🎓 "+ex.titre+" réussi"); confetti(); }
  const wrong=Q.wrong.slice(); Q=null;
  view.innerHTML=`<div class="panel result">
    <h2>${complete?`Résultat · ${ex.titre}`:"Évaluation interrompue"}</h2>
    ${complete?`<div class="big">${note} / 20</div><p style="margin:0;font-weight:800;font-size:1.2rem">${mention(note)}</p>`:`<p style="margin:0">L’évaluation n’est pas terminée : la note n’est pas enregistrée.</p>`}
    ${wrong.length?`<div style="text-align:left;width:100%"><b>À revoir :</b><ul>${wrong.map(q=>`<li>${txt(q.q)}<br><small class="note">${txt(q.e)}</small></li>`).join("")}</ul></div>`:""}
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="go" id="evAgain">Recommencer</button><button class="go alt" id="evHome">Retour à l’accueil</button></div></div>`;
  $("#evAgain").onclick=()=>openEval(id); $("#evHome").onclick=()=>showHome(false);
}

function openChap(id){
  $("#tabs").hidden=false; $("#backHome").textContent="← Tous les chapitres";
  S.chap=id; save();
  screen("scrChap"); renderChapHead(); show("apprendre");
}
/* ---------- ESPACE PARENT ---------- */
const PINKEY="mitsvot-parent-code";
function ago(t){
  const m=Math.round((Date.now()-new Date(t).getTime())/60000);
  if(m<1) return "à l’instant"; if(m<60) return `il y a ${m} min`;
  const h=Math.round(m/60); if(h<24) return `il y a ${h} h`;
  const d=Math.round(h/24); return d===1?"hier":`il y a ${d} jours`;
}
function showParent(){
  let pin=""; try{pin=localStorage.getItem(PINKEY)||"";}catch(e){}
  screen("scrParent");
  if(pin) return loadParent(pin);
  parentLogin();
}
function parentLogin(err){
  $("#scrParent").innerHTML=`
    <button class="back" id="pBack">← Retour</button>
    <div class="panel"><h2>👨‍👩‍👧 Espace parent</h2>
      <p style="margin:0">Entre le code parent pour voir la progression de chaque prénom.</p>
      ${err?`<div class="feedback ko"><span>${esc(err)}</span></div>`:""}
      <form class="newname" id="pinForm" style="justify-content:flex-start">
        <input id="pin" type="password" autocomplete="current-password" placeholder="Code parent" aria-label="Code parent">
        <button class="go" type="submit">Voir</button>
      </form></div>`;
  $("#pBack").onclick=()=>showWho();
  $("#pinForm").onsubmit=e=>{e.preventDefault();loadParent($("#pin").value.trim());};
}
async function loadParent(pin){
  $("#scrParent").innerHTML=`<button class="back" id="pBack">← Retour</button><div class="panel"><p style="margin:0">Chargement des progressions…</p></div>`;
  $("#pBack").onclick=()=>showWho();
  let rows;
  try{ rows=await rpc("mitsvot_dashboard",{p_pin:pin}); }
  catch(e){
    try{localStorage.removeItem(PINKEY);}catch(_){}
    return parentLogin(/code/i.test(e.message)?"Code incorrect.":"Impossible de joindre le serveur. Vérifie la connexion internet et réessaie.");
  }
  try{localStorage.setItem(PINKEY,pin);}catch(e){}
  renderParent(rows||[]);
}
function renderParent(rows){
  const kid=r=>{
    const d=r.data||{}, qs=d.qs||{}, lv=Math.floor((d.xp||0)/150)+1;
    const ok=CHAPITRES.reduce((a,c)=>a+c.questions.filter(q=>qs[q.id]&&qs[q.id].last).length,0);
    const tot=CHAPITRES.reduce((a,c)=>a+c.questions.length,0);
    const chs=CHAPITRES.filter(c=>c.questions.some(q=>qs[q.id])||Object.keys(d.read||{}).some(k=>k.startsWith(c.id+":")));
    const wrong=CHAPITRES.flatMap(c=>c.questions.filter(q=>qs[q.id]&&!qs[q.id].last).map(q=>({c,q})));
    const evs=Object.entries(d.evals||{});
    return `<article class="kid">
      <header><span class="av" style="background:${avColor(r.name)}">${esc([...r.name][0].toUpperCase())}</span>
        <div style="min-width:0"><h3>${esc(r.name)}</h3><small>Niveau ${lv} · dernière activité ${ago(r.updated_at)}</small></div></header>
      <div class="kgrid">
        <div><b>${d.xp||0}</b><small>étoiles</small></div>
        <div><b>${ok}/${tot}</b><small>questions réussies</small></div>
        <div><b>${Object.keys(d.badges||{}).length}</b><small>trophées</small></div>
        <div><b>${d.best||0}</b><small>meilleure série</small></div>
      </div>
      ${evs.length?`<div class="kch"><div class="t"><span>🎓 Évaluations</span></div>${evs.map(([g,e])=>`<div style="display:flex;justify-content:space-between;font-weight:700"><span>${(examById(g)||{titre:"Évaluation"}).titre}</span><span>${e.best}/20 (dernière : ${e.last}/20, ${e.tries} essai${e.tries>1?"s":""})</span></div>`).join("")}</div>`:""}
      ${chs.length?chs.map(c=>{const p=Math.round(c.questions.filter(q=>qs[q.id]&&qs[q.id].last).length/c.questions.length*100);
        const read=Object.keys(SECTIONS).filter(s=>(d.read||{})[c.id+":"+s]).length;
        return `<div class="kch"><div class="t"><span>Chapitre ${c.numero} · ${esc(c.titre)}</span><span>${p} %</span></div>
        <div class="kbars">${Object.keys(SECTIONS).map(s=>{const qq=c.questions.filter(q=>q.s===s),m=qq.filter(q=>qs[q.id]&&qs[q.id].last).length;return `<div><small>${secName(c,s)} · ${m}/${qq.length}</small><div class="progress"><i style="width:${m/qq.length*100}%"></i></div></div>`;}).join("")}</div>
        <small class="note">Fiches lues : ${read}/${Object.keys(SECTIONS).length} · Record défi éclair : ${(d.defiBest||{})[c.id]||0}</small></div>`;}).join(""):`<p class="note" style="margin:0">Pas encore de quiz commencé.</p>`}
      ${wrong.length?`<details><summary>Questions à revoir (${wrong.length})</summary><ul>${wrong.map(({c,q})=>`<li>${txt(q.q)} <small class="note">(ch. ${c.numero})</small></li>`).join("")}</ul></details>`:""}
    </article>`;
  };
  $("#scrParent").innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <button class="back" id="pBack">← Retour</button>
      <div style="display:flex;gap:8px"><button class="say" id="pRefresh">🔄 Actualiser</button><button class="say" id="pOut">🔒 Fermer</button></div>
    </div>
    <h1 style="font-size:clamp(1.7rem,6vw,2.3rem);color:var(--wool)">👨‍👩‍👧 Espace parent</h1>
    <p class="note" style="margin:0">${rows.length} prénom${rows.length>1?"s":""} enregistré${rows.length>1?"s":""}. La progression est envoyée en ligne automatiquement pendant le jeu (connexion internet nécessaire).</p>
    ${rows.length?rows.map(kid).join(""):`<div class="panel"><p style="margin:0">Aucune progression enregistrée pour l’instant.</p></div>`}`;
  $("#pBack").onclick=()=>showWho();
  $("#pRefresh").onclick=()=>{let p="";try{p=localStorage.getItem(PINKEY)||"";}catch(e){} p?loadParent(p):parentLogin();};
  $("#pOut").onclick=()=>{try{localStorage.removeItem(PINKEY);}catch(e){} showWho();};
}

$("#homeBtn").onclick=()=>showHome(false);
$("#backHome").onclick=()=>{Q=null;showHome(false);};
$("#whoBtn").onclick=()=>showWho();

showWho();
</script>

</body></html>
