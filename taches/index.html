<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pour Jonathan</title>
<meta name="theme-color" content="#1f3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pour Jonathan">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#f4f6f9; --card:#fff; --ink:#1c2533; --muted:#6b7686; --line:#e3e7ee; --navy:#1f3a5f; --red:#d9534f; --green:#2e8b57; }
  * { box-sizing: border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust:100%; }
  header { background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top) + 14px) 16px 14px; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:2px 0 0; opacity:.8; font-size:14px; }
  main { max-width:560px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom) + 24px); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:16px; }
  label { display:block; font-size:14px; color:var(--muted); margin:0 0 6px; }
  input[type=text], input[type=password], textarea { width:100%; font:inherit; font-size:16px; padding:12px; border:1px solid var(--line); border-radius:10px; background:#fff; color:var(--ink); }
  textarea { min-height:64px; resize:vertical; margin-top:8px; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:10px; }
  .urg { display:flex; align-items:center; gap:8px; font-size:15px; }
  .urg input { width:22px; height:22px; accent-color:var(--red); }
  button { font:inherit; border:0; border-radius:10px; padding:12px 18px; background:var(--navy); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  button.link { background:none; color:var(--muted); padding:6px; font-weight:400; font-size:14px; }
  h2 { font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin:20px 4px 8px; }
  ul { list-style:none; margin:0; padding:0; }
  li { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px; display:flex; gap:10px; align-items:flex-start; }
  li.urgent { border-left:4px solid var(--red); }
  li.fait { opacity:.65; }
  li.fait .t { text-decoration:line-through; }
  .ico { font-size:20px; line-height:1.2; }
  .txt { flex:1; min-width:0; overflow-wrap:anywhere; }
  .t { font-weight:600; }
  .d { color:var(--muted); font-size:14px; margin-top:2px; white-space:pre-wrap; }
  .when { color:var(--muted); font-size:13px; margin-top:4px; }
  .pill { display:inline-block; font-size:12px; font-weight:600; padding:1px 8px; border-radius:20px; margin-left:6px; vertical-align:1px; }
  .pill.r { background:#fde8e7; color:var(--red); }
  .pill.g { background:#e3f3ea; color:var(--green); }
  .del { background:none; color:var(--muted); padding:4px 6px; font-size:18px; font-weight:400; }
  .vide { color:var(--muted); text-align:center; padding:18px; }
  .msg { padding:10px 12px; border-radius:10px; margin-bottom:12px; font-size:15px; }
  .msg.err { background:#fde8e7; color:#9b2c28; }
  .msg.ok { background:#e3f3ea; color:#1d6b40; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>📝 Pour Jonathan</h1>
  <p>Ce que tu ajoutes ici arrive dans sa liste « À faire ».</p>
</header>
<main>
  <div id="msg" class="msg" hidden></div>

  <section id="login" class="card" hidden>
    <form id="fLogin">
      <label for="code">Code d'accès</label>
      <input id="code" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="xxxx-xxxx-xxxx" required>
      <div class="row"><span></span><button type="submit">Entrer</button></div>
    </form>
  </section>

  <section id="app" hidden>
    <form id="fAdd" class="card">
      <label for="titre">Nouvelle chose à faire</label>
      <input id="titre" type="text" maxlength="300" placeholder="Ex. : appeler le plombier" required enterkeyhint="send">
      <textarea id="details" maxlength="1000" placeholder="Précisions (facultatif)"></textarea>
      <div class="row">
        <label class="urg" for="urgent"><input id="urgent" type="checkbox"> Urgent</label>
        <button id="bAdd" type="submit">Ajouter</button>
      </div>
    </form>

    <h2>À faire</h2>
    <ul id="todo"></ul>
    <h2>Fait par Jonathan</h2>
    <ul id="done"></ul>
    <div class="row" style="justify-content:center"><button class="link" id="logout" type="button">Se déconnecter</button></div>
  </section>
</main>
<script>
const SB = 'https://nfhnkkohtudtlintiihu.supabase.co';
const KEY = 'sb_publishable_p9jx-y23N2UNn84720sJmA_XiSr2ZIY';
const K = 'taches-code';
const $ = (id) => document.getElementById(id);
const store = { get() { try { return localStorage.getItem(K) || ''; } catch { return ''; } },
  set(v) { try { v ? localStorage.setItem(K, v) : localStorage.removeItem(K); } catch {} } };
let code = store.get();

async function rpc(fn, args) {
  const r = await fetch(`${SB}/rest/v1/rpc/${fn}`, {
    method: 'POST',
    headers: { apikey: KEY, Authorization: `Bearer ${KEY}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(args),
  });
  const txt = await r.text();
  const data = txt ? JSON.parse(txt) : null;
  if (!r.ok) throw new Error((data && data.message) || 'Erreur réseau');
  return data;
}
function flash(text, ok) {
  const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); m.hidden = false;
  clearTimeout(flash.t); flash.t = setTimeout(() => { m.hidden = true; }, ok ? 2500 : 6000);
}
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const clean = (d) => String(d || '').replace(/^💕 Ajouté par ta femme( · )?/, '');
function quand(iso) {
  const d = new Date(iso), now = new Date();
  const j = Math.round((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);
  const h = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  if (j === 0) return `aujourd'hui à ${h}`;
  if (j === 1) return `hier à ${h}`;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }) + ` à ${h}`;
}
function item(t) {
  const fait = !!t.done_at;
  const urg = t.priorite === 1 && !fait;
  return `<li class="${fait ? 'fait' : ''} ${urg ? 'urgent' : ''}">
    <span class="ico">${fait ? '✅' : '📌'}</span>
    <div class="txt">
      <div class="t">${esc(t.titre)}${urg ? '<span class="pill r">Urgent</span>' : ''}</div>
      ${clean(t.details) ? `<div class="d">${esc(clean(t.details))}</div>` : ''}
      <div class="when">${fait ? `<span class="pill g" style="margin-left:0">Fait</span> ${quand(t.done_at)}` : 'Ajouté ' + quand(t.created_at)}</div>
    </div>
    ${fait ? '' : `<button class="del" data-id="${t.id}" aria-label="Supprimer">🗑</button>`}
  </li>`;
}
async function load(silent) {
  try {
    const list = await rpc('famille_taches', { p_code: code });
    const a = list.filter((t) => !t.done_at), f = list.filter((t) => t.done_at);
    $('todo').innerHTML = a.length ? a.map(item).join('') : '<div class="vide">Rien en attente 🎉</div>';
    $('done').innerHTML = f.length ? f.map(item).join('') : '<div class="vide">Rien de coché pour l\'instant.</div>';
    return true;
  } catch (e) {
    if (/code/i.test(e.message)) { logout(); flash('Code incorrect.'); }
    else if (!silent) flash('Pas de connexion. Réessaie dans un instant.');
    return false;
  }
}
function show() { $('login').hidden = !!code; $('app').hidden = !code; if (code) load(); else $('code').focus(); }
function logout() { code = ''; store.set(''); show(); }

$('fLogin').addEventListener('submit', async (e) => {
  e.preventDefault();
  code = $('code').value.trim().toLowerCase();
  if (await load()) { store.set(code); $('code').value = ''; show(); } 
});
$('fAdd').addEventListener('submit', async (e) => {
  e.preventDefault();
  const titre = $('titre').value.trim(); if (!titre) return;
  $('bAdd').disabled = true;
  try {
    await rpc('famille_ajouter', { p_code: code, p_titre: titre, p_details: $('details').value.trim() || null, p_urgent: $('urgent').checked });
    $('titre').value = ''; $('details').value = ''; $('urgent').checked = false;
    flash('Ajouté à la liste de Jonathan ✓', true);
    load();
  } catch (e2) { flash(e2.message === 'Code incorrect' ? 'Code incorrect.' : 'Pas envoyé : vérifie la connexion et réessaie.'); }
  $('bAdd').disabled = false;
});
document.addEventListener('click', async (e) => {
  const b = e.target.closest('.del'); if (!b) return;
  if (!confirm('Supprimer cette tâche de la liste de Jonathan ?')) return;
  try { await rpc('famille_supprimer', { p_code: code, p_id: b.dataset.id }); load(); } catch { flash('Pas supprimé, réessaie.'); }
});
$('logout').addEventListener('click', logout);
document.addEventListener('visibilitychange', () => { if (!document.hidden && code) load(true); });
setInterval(() => { if (code && !document.hidden) load(true); }, 60000);
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});
show();
</script>
</body>
</html>
